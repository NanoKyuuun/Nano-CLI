[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocli"
version = "0.1.0"
description = "Local AI Coding Assistant with Project Memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "ollama>=0.1.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
nanocli = "nanocli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanocli*"]

[tool.ruff]
line-length = 88
target-version = "py310"
